<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Record once</title>
<style>
body{font:17px system-ui;background:#f5f3ee;color:#252b2b;max-width:640px;margin:7vh auto;padding:24px}h1{font-size:40px;letter-spacing:-1.5px}label{display:block;margin:20px 0 8px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7bdb8;border-radius:8px;background:white;font:inherit}button{padding:12px 18px;font:inherit;cursor:pointer;border:1px solid #b7bdb8;border-radius:8px;background:white}#record{display:block;width:104px;height:104px;border-radius:50%;margin:32px auto;background:#c93838;color:white;border:8px solid #f0d5d0}button:disabled{opacity:.5;cursor:default}#status{min-height:2em;text-align:center}textarea{min-height:180px}small{color:#55605b}#retry{display:none}
</style>
<h1>Record once.</h1><p>Your transcription server can wake up while you wait.</p>
<form id="login" action="/login" method="post">
<label for="username">Username</label><input id="username" name="username" value="owner" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<small>Sign in once on this device. Your password manager can save and sync this login.</small>
<p><button type="submit">Sign in</button></p></form>
<p id="signed-in" hidden>Signed in on this device. <button id="logout">Sign out</button></p>
<label for="model">Model</label><select id="model" disabled><option value="">Sign in to load models</option></select>
<button id="record" aria-label="Start recording">Record</button>
<p id="status" role="status">Ready to record.</p><button id="retry">Retry upload</button> <button id="resume">Check saved job</button> <button id="retry-job" hidden>Retry transcription</button>
<p id="job" role="status"></p>
<label for="result">Transcription</label><textarea id="result" readonly></textarea><button id="copy">Copy text</button>
<script src="/recorder.js"></script></html>
