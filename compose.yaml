services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8080}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - queue:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  queue:
