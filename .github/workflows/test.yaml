name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        env:
          ASR_NETWORK_TESTS: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/recorder.test.cjs
      - name: Test native browser login
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          python tests/browser_login.py
      - run: docker build -t asr-gateway:test .
      - run: bash tests/container_port.sh
