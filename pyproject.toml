[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-wake-gateway"
version = "0.1.0"
description = "Durable transcription requests for a sleeping Speaches backend"
requires-python = ">=3.10"
dependencies = ["gunicorn==23.0.0"]

[tool.setuptools.package-data]
asr_gateway = ["recorder.html", "recorder.js"]
